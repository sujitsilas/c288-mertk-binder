[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "c288-mertk-binder"
version = "0.2.0"
description = "Structure-guided MERTK binder design and biological validation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3",
  "biopython>=1.85,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
analysis = ["matplotlib>=3.10,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
