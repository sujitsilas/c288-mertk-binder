[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "c288-mertk-binder"
version = "0.1.0"
description = "Geometry-conditioned ESM3 interface sequence redesign"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3",
  "biopython>=1.85,<2",
  "requests>=2.32,<3",
  "huggingface-hub>=0.34,<1",
]

[project.optional-dependencies]
train = ["esm==3.4.2", "torch>=2.11,<2.12"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
